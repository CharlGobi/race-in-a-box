name: Database

# Applies supabase/migrations to the live database after the tests pass.
# Needs one secret, SUPABASE_DB_URL: the connection string from the Supabase
# dashboard (Connect, Session pooler), with the database password filled in.

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/db
      - name: Check the secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "SUPABASE_DB_URL is not set, skipping"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --yes: the run has no one to answer "Apply these migrations?".
      - run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
